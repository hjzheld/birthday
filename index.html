<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- 기본 정보 -->
    <title>공재권님의 팔순잔치에 초대합니다</title>

    <meta
      name="description"
      content="소중한 분들을 공재권님의 팔순잔치에 정중히 초대합니다."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.png"
    />

    <!-- ==========================================
         Open Graph
    =========================================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="공재권님의 팔순잔치에 초대합니다"
    />

    <meta
      property="og:description"
      content="여든 해의 귀한 시간을 함께 축하해주세요."
    />

    <meta
      property="og:image"
      content="https://hjzheld.github.io/birthday/og-image.png"
    />

    <meta
      property="og:url"
      content="https://hjzheld.github.io/birthday"
    />

    <meta
      property="og:site_name"
      content="공재권님의 팔순잔치"
    />

    <meta
      property="og:locale"
      content="ko_KR"
    />

    <!-- ==========================================
         Twitter / 기타 미리보기
    =========================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="공재권님의 팔순잔치에 초대합니다"
    />

    <meta
      name="twitter:description"
      content="여든 해의 귀한 시간을 함께 축하해주세요."
    />

    <meta
      name="twitter:image"
      content="https://hjzheld.github.io/birthday/og-image.png"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
